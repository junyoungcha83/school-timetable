<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>주간 시간표</title>
<link rel="stylesheet" href="assets/app.css" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ec4899" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />

<!-- iOS Safari 홈 화면 추가 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="시간표" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
</head>
<body>

<header class="app-header">
  <h1>주간 시간표</h1>
  <div class="header-right">
    <span class="sync-status" id="syncStatus"></span>
    <button class="icon-btn" id="btnEdit" title="편집 잠금/해제" aria-label="편집">🔒</button>
  </div>
</header>

<nav class="top-tabs" role="tablist" aria-label="상위 탭">
  <button class="top-tab active" role="tab" data-tab="grid" aria-selected="true">시간표</button>
  <button class="top-tab" role="tab" data-tab="detail" aria-selected="false">시간표상세</button>
  <button class="top-tab" role="tab" data-tab="calendar" aria-selected="false">달력</button>
  <button class="top-tab" role="tab" data-tab="list" aria-selected="false">목록</button>
</nav>

<nav class="mini-tabs" id="miniTabs" role="tablist" aria-label="아이">
  <!-- JS 가 활성 탭에 따라 채움 (상세: 승호/승아, 시간표: 승호/승아/승승) -->
</nav>

<main class="app-main">
  <!-- 상세 탭 -->
  <section class="tab-panel hidden" id="tabDetail" data-tab="detail">
    <div class="detail-list" id="detailList"></div>
    <button class="fab-save" id="btnSave" type="button">저장</button>
  </section>

  <!-- 시간표 탭 -->
  <section class="tab-panel" id="tabGrid" data-tab="grid">
    <div class="grid-wrap" id="gridWrap"></div>
  </section>

  <!-- 달력 탭 -->
  <section class="tab-panel hidden" id="tabCalendar" data-tab="calendar">
    <div class="cal-bar">
      <button class="cal-nav" id="calPrev" aria-label="이전 달">‹</button>
      <strong class="cal-title" id="calTitle">·</strong>
      <button class="cal-nav" id="calNext" aria-label="다음 달">›</button>
      <span class="cal-grow"></span>
      <button class="cal-mini" id="calToday">오늘</button>
      <button class="cal-mini" id="calMembers">👥 구성원</button>
    </div>
    <div class="cal-week" id="calWeek"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-day hidden" id="calDay"></div>
  </section>

  <!-- 목록 탭 -->
  <section class="tab-panel hidden" id="tabList" data-tab="list">
    <div id="listView" class="ev-listview"></div>
  </section>
</main>

<!-- 일정 추가/수정 -->
<div id="evModal" class="ev-overlay hidden">
  <div class="ev-sheet">
    <div class="ev-sheet-head"><span id="evModalTitle">일정 추가</span><button class="ev-x" id="evClose">×</button></div>
    <div class="ev-sheet-body">
      <label>제목</label>
      <input id="evTitleIn" type="text" placeholder="예: 가족 저녁식사" />
      <div class="ev-row2">
        <div><label>시작일</label><input id="evStartDate" type="date" /></div>
        <div><label>시작시간 <small>(선택)</small></label><input id="evStartTime" type="time" /></div>
      </div>
      <div class="ev-row2">
        <div><label>종료일</label><input id="evEndDate" type="date" /></div>
        <div><label>종료시간 <small>(선택)</small></label><input id="evEndTime" type="time" /></div>
      </div>
      <label>담당 가족</label>
      <div id="evMemberChips" class="ev-chips"></div>
      <label>메모 <small>(선택)</small></label>
      <textarea id="evMemoIn" rows="2" placeholder="장소·준비물 등"></textarea>
      <div class="ev-actions">
        <button id="evDeleteBtn" class="ev-btn danger hidden">삭제</button>
        <button id="evSaveBtn" class="ev-btn primary">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 가족 구성원 -->
<div id="memModal" class="ev-overlay hidden">
  <div class="ev-sheet">
    <div class="ev-sheet-head"><span>가족 구성원</span><button class="ev-x" id="memClose">×</button></div>
    <div class="ev-sheet-body">
      <div id="memList" class="mem-list2"></div>
      <label>새 구성원</label>
      <div class="ev-row2">
        <input id="memNameIn" type="text" placeholder="이름 (예: 엄마)" />
        <input id="memColorIn" type="color" value="#fca5a5" />
      </div>
      <div class="ev-actions"><button id="memAddBtn" class="ev-btn primary">추가</button></div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  // service worker 등록 (file:// 에서는 동작 안 함 — http(s) 에서만)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
